# Сетка
width: 150
height: 150

# Ресурсы
max_resource: 30.0
regen_rate: 5.0
max_spice: 30.0
regen_rate_spice: 5.0

# Динамика среды
season_period: 100
season_amplitude: 0.3
catastrophe_prob: 0.005
min_vision: 1
max_vision: 4
min_metabolism: 0.5
max_metabolism: 1.5

# === ПАРАМЕТРЫ МЕТАБОЛИЗМА (SPICE) - Пункт 2.1 ===
min_metabolism_spice: 0.5
max_metabolism_spice: 1.5
initial_resource: 10.0
initial_spice: 10.0

initial_agents: 20
max_age: 300

# Память (Пункт 1.2)
memory_size: 10

# === СОЦИАЛЬНОЕ ОБУЧЕНИЕ (Пункт 1.3) ===
min_imitation_intensity: 0.1
max_imitation_intensity: 10.0
initial_imitation_rate: 0.2

# Эволюция
reproduction_threshold: 20.0
mutation_rate: 0.1

# Игра (Payoffs)
R: 3.0
S: 0.0
T: 5.0
P: 1.0

# Симуляция
max_steps: 500
seed: 42

# === СОЦИАЛЬНАЯ СЕТЬ (Пункт 3.1) ===
network_type: "barabasi_albert"
network_param_m: 3
network_param_k: 4
network_param_p: 0.1

# === Производительность и устойчивость ===
network_payoff_mode: "mean"
offspring_network_edges: 0
max_network_degree: 0
use_food_carrying_capacity: true
max_population: 3000
max_runtime_seconds: 0

# Многоуровневый отбор (Пункт 1.6)
group_selection_enabled: true
num_groups: 10
group_selection_intensity: 0.3
group_migration_rate: 0.02
group_competition_step: 50

# === ТОРГОВЛЯ (TRADE) - Пункт 2.1 ===
trade_enabled: true

# === ЗАГРЯЗНЕНИЕ / ИСТОЩЕНИЕ (Пункт 2.2) ===
pollution_enabled: true
pollution_production_rate: 0.15   # Отходы от сбора (harvest)
pollution_consumption_rate: 0.25  # Отходы от метаболизма
pollution_diffusion_rate: 0.20    # Диффузия к соседям
pollution_decay_rate: 0.05        # Естественное разложение
pollution_capacity_impact: 1.5    # Насколько 1 ед. отходов снижает capacity

# === ОСТРОВНАЯ МОДЕЛЬ (Пункт 2.3) ===
island_model_enabled: true
islands_count: 4
island_migration_rate: 0.01 # Вероятность миграции агента на другой остров за один шаг

# === ДИНАМИКА ПИКОВ РЕСУРСОВ (Пункт 2.5) ===
resource_peaks_drift_speed: 1.0 # Скорость дрейфа пиков (макс. смещение в ячейках за шаг)
resource_peaks_mutation_prob: 0.05 # Вероятность появления/исчезновения пика за шаг

# === КУЛЬТУРНАЯ ПЕРЕДАЧА (Пункт 4.4: Tag-flipping) ===
tag_flipping_enabled: true
tag_length: 11 # Длина культурного тега (классика Эпштейна - 11 бит)