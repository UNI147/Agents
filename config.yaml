# Сетка
width: 50
height: 50

# Ресурсы
max_resource: 4.0
regen_rate: 1.0

# Динамика среды
season_period: 100
season_amplitude: 0.5
catastrophe_prob: 0.005
catastrophe_duration: 15
catastrophe_severity: 0.3

# Агенты
initial_agents: 200
min_vision: 1
max_vision: 6
min_metabolism: 1.0
max_metabolism: 4.0
initial_resource: 15.0
max_age: 200

# Память (Пункт 1.2)
memory_size: 10

# === СОЦИАЛЬНОЕ ОБУЧЕНИЕ (Пункт 1.3) ===
min_imitation_intensity: 0.1    # Минимальный параметр m для Ферми/Моран
max_imitation_intensity: 10.0   # Максимальный параметр m
initial_imitation_rate: 0.2     # Начальная вероятность попытки имитации

# Эволюция
reproduction_threshold: 40.0
mutation_rate: 0.1

# Игра (Payoffs)
R: 3.0
S: 0.0
T: 5.0
P: 1.0

# Симуляция
max_steps: 500
seed: 42

# === СОЦИАЛЬНАЯ СЕТЬ (Пункт 3.1) ===
network_type: "barabasi_albert" # Опции: "barabasi_albert" (scale-free), "watts_strogatz" (small-world), "random", "none"
network_param_m: 3             # Число ребер, прикрепляемых к новому узлу (для BA)
network_param_k: 4             # Число ближайших соседей (для WS, должно быть четным)
network_param_p: 0.1           # Вероятность переподключения (для WS) / плотность (для random)

# === Производительность и устойчивость ===
network_payoff_mode: "mean"       # mean | sum
offspring_network_edges: 0        # 0 = автоматически по типу сети
max_network_degree: 0             # 0 = без ограничения; можно задать вручную
use_food_carrying_capacity: true  # экологическая ёмкость по ресурсу
max_population: 0                 # 0 = автоматически
max_runtime_seconds: 0            # 0 = без ограничения по времени

# Многоуровневый отбор (Пункт 1.6)
group_selection_enabled: true
num_groups: 10
group_selection_intensity: 0.3  # Вес группового фитнеса (alpha)
group_migration_rate: 0.02      # Вероятность смены группы при рождении
group_competition_step: 50      # Каждые N шагов происходит конкуренция групп